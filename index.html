<style>
:root{

  --s-transport:#2a78d6; --s-crusher:#eb6834; --s-mixer:#1baf7a; --s-paint:#eda100; --s-rental:#e87ba4;
  --good:#16893f; --bad:#d23c3c; --warn:#e0a526;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text-primary);font-family:"Segoe UI",Tahoma,"Noto Kufi Arabic","Noto Sans Arabic",sans-serif;font-size:14px}
.wrap{max-width:1360px;margin:0 auto;padding:22px 22px 40px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
h1{margin:0;font-size:24px;font-weight:700;letter-spacing:0}
.sub{color:var(--text-secondary);margin-top:6px;font-size:13px}
.seg{display:inline-flex;background:var(--surface-1);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{all:unset;cursor:pointer;padding:8px 16px;border-radius:9px;color:var(--text-secondary);font-weight:600;font-size:13px}
.seg button:hover{color:var(--text-primary)}
.seg button.on{background:#eaf1fc;color:#1c5cab;box-shadow:inset 0 0 0 1px #b7d3f6}
.seg button:focus-visible{outline:2px solid #3987e5}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.flabel{color:var(--text-muted);font-size:12px}
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.kpi .lbl{color:var(--text-secondary);font-size:12.5px}
.kpi .val{font-size:26px;font-weight:700;margin-top:6px;direction:ltr;text-align:right}
.kpi .val small{font-size:13px;color:var(--text-muted);font-weight:600}
.kpi .note{font-size:12px;color:var(--text-muted);margin-top:4px}
.up{color:var(--good)} .down{color:var(--bad)}
.sectors{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
.sec{cursor:pointer;position:relative;overflow:hidden;transition:border-color .15s, transform .15s}
.sec:hover{border-color:#c9d1dd}
.sec.on{border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset}
.sec .bar{position:absolute;inset:0 0 auto 0;height:3px;background:var(--c)}
.sec .nm{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.dot{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.sec .v{font-size:20px;font-weight:700;margin-top:10px;direction:ltr;text-align:right}
.sec .meta{display:flex;justify-content:space-between;color:var(--text-muted);font-size:12px;margin-top:4px}
.sec svg{display:block;margin-top:8px}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-bottom:14px}
.ct{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:10px}
.ct h3{margin:0;font-size:15px}
.ct .hint{color:var(--text-muted);font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:8px;color:var(--text-secondary);font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
svg text{font-family:inherit}
.mx{width:100%;border-collapse:separate;border-spacing:4px}
.mx th{color:var(--text-secondary);font-weight:600;font-size:12.5px;padding:6px;text-align:center}
.mx th.rh{text-align:right}
.mx td{text-align:center;padding:12px 6px;border-radius:9px;cursor:pointer;font-weight:700;direction:ltr;font-size:13px;transition:outline .1s}
.mx td.rhc{cursor:default;text-align:right;direction:rtl;font-weight:600;padding-inline:4px}
.mx td.cell:hover{outline:2px solid #e8edf5}
.mx td.sel{outline:2px solid #fff}
.mx td.tot{background:var(--surface-2);cursor:default;color:var(--text-secondary)}
.detail{margin-top:4px}
.dhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:14px}
.dhead h2{margin:0;font-size:19px;display:flex;align-items:center;gap:10px}
.dhead h2 .dot{width:14px;height:14px;border-radius:4px}
.dk{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.dk .card{padding:12px 14px;background:var(--surface-2)}
.dk .lbl{color:var(--text-secondary);font-size:12px}
.dk .val{font-size:19px;font-weight:700;margin-top:4px;direction:ltr;text-align:right}
.charts2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.charts2.one{grid-template-columns:1fr}
.banner{background:#fff8e6;border:1px solid #f1d58a;color:#6b4e00;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.search{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;color:var(--text-primary);padding:8px 12px;min-width:240px;font:inherit}
.search:focus{outline:2px solid #3987e5}
.tw{overflow:auto;max-height:520px;border:1px solid var(--line);border-radius:10px}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
.dt th{position:sticky;top:0;background:#eef2f7;color:var(--text-secondary);font-weight:600;text-align:right;padding:10px;white-space:nowrap;cursor:pointer;user-select:none;border-bottom:1px solid var(--line)}
.dt th:hover{color:var(--text-primary)}
.dt td{padding:9px 10px;border-bottom:1px solid #eef1f5;white-space:nowrap}
.dt td.n{direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.dt tbody tr:hover{background:#f5f8fc}
.dt tfoot td{position:sticky;bottom:0;background:#eef2f7;font-weight:700;border-top:1px solid var(--line)}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;background:#eef1f5;color:var(--text-secondary);font-size:11.5px}
.tag.yes{background:#e3f5ea;color:#16683a}
.muted{color:var(--text-muted)}
#tip{position:fixed;pointer-events:none;background:#ffffff;border:1px solid #d7dde7;border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--text-primary);z-index:50;opacity:0;transition:opacity .08s;max-width:280px;box-shadow:0 8px 24px rgba(16,24,40,.14)}
#tip b{display:block;margin-bottom:3px}
#tip .tv{direction:ltr;text-align:right}
.src{color:var(--text-muted);font-size:11.5px;margin-top:8px}
.charts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.chart-card{position:relative;overflow:hidden}
.chart-card .bar{position:absolute;inset:0 0 auto 0;height:3px;background:var(--c)}
.chart-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.chart-card .nm{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.chart-card .tv{font-size:20px;font-weight:700;direction:ltr;text-align:left}
.chart-card .meta{display:flex;justify-content:space-between;color:var(--text-muted);font-size:12px;margin-top:2px}
.mbar{cursor:pointer;transition:opacity .12s}
.mbar:hover .bfill{filter:brightness(1.18)}
.mbar:focus{outline:none}
.mbar:focus-visible .bfill{stroke:#fff;stroke-width:2}
.overlay{position:fixed;inset:0;background:rgba(20,26,36,.45);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:40;padding:24px}
.overlay.open{display:flex}
.modal{background:var(--surface-1);border:1px solid #d7dde7;border-radius:16px;width:min(1240px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(16,24,40,.25);animation:pop .16s ease-out}

.mhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--line)}
.mhead h2{margin:0;font-size:19px;display:flex;align-items:center;gap:10px}
.mhead h2 .dot{width:14px;height:14px;border-radius:4px}
.mbody{overflow:auto;padding:18px 20px 20px}
.close{all:unset;cursor:pointer;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--text-secondary);background:var(--surface-2);border:1px solid var(--line);font-size:15px}

.close:focus-visible{outline:2px solid #3987e5}
.mbody .tw{max-height:430px}
.seg.mini{margin:6px 0 12px}
#shareSeg,#mMonths{direction:ltr}
.seg.mini button{padding:6px 12px;font-size:12px}
.share{display:flex;flex-direction:column;gap:12px}
.srow{cursor:pointer;padding:6px 8px;margin:0 -8px;border-radius:9px}
.srow:hover{background:var(--surface-2)}
.srow:focus-visible{outline:2px solid #3987e5}
.slab{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;margin-bottom:6px}
.slab span:first-child{display:inline-flex;align-items:center;gap:7px}
.sval{direction:ltr;font-variant-numeric:tabular-nums}
.sval em{font-style:normal;color:var(--text-muted);font-weight:500;margin-left:6px;font-size:12px}
.strack{height:12px;background:#eef1f5;border-radius:4px;overflow:hidden}
.sfill{height:100%;border-radius:4px}
.donut{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.dleg{flex:1;min-width:190px;display:flex;flex-direction:column;gap:4px}
.lrow{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600}
.lrow span:first-child{display:inline-flex;align-items:center;gap:7px}
.dseg{transition:opacity .12s}
.donut svg:hover .dseg{opacity:.55}
.donut svg .dseg:hover{opacity:1}
.credits{display:flex;gap:8px;flex-wrap:wrap}
.credits div{background:var(--surface-1);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600}
.credits span{color:var(--text-muted);font-weight:500;margin-left:4px}
footer{color:var(--text-muted);font-size:12px;margin-top:18px;line-height:1.8}

@media (max-width:620px){.charts{grid-template-columns:1fr}.overlay{padding:8px}.sectors{grid-template-columns:1fr 1fr}.kpis,.dk{grid-template-columns:1fr}}
</style>
</head>

const MONTHS=[{k:'aug',n:'أغسطس'},{k:'sep',n:'سبتمبر'},{k:'oct',n:'أكتوبر'}];
const MN=Object.fromEntries(MONTHS.map(m=>[m.k,m.n]));
const SECTORS=[
 {k:'transport',n:'النقليات',c:'var(--s-transport)',hex:'#2a78d6',src:'ملف النقليات (TRANSPORTATION TRIPS SUMMARY)'},
 {k:'crusher',n:'الكسارات',c:'var(--s-crusher)',hex:'#eb6834',src:'ملف مبيعات الكسارات (Summary Of Crusher Sales)'},
 {k:'mixer',n:'الخلاطة',c:'var(--s-mixer)',hex:'#1baf7a',src:'ملف مبيعات الخلاطة (Al Hasa Plant – Asphalt)'},
 {k:'paint',n:'الدهانات + الأسفلت',c:'var(--s-paint)',hex:'#eda100',src:'ملف خدمات الخلاطة (فرقة الدهانات والأسفلت)'},
 {k:'rental',n:'تأجير المعدات',c:'var(--s-rental)',hex:'#e87ba4',src:'ملف RENTAL EQP AUG-SEP-OCT'},
];
const SC=Object.fromEntries(SECTORS.map(s=>[s.k,s]));
const S=DATA.summary;
const state={month:'oct',sector:'transport',q:'',sort:null};

const nf=new Intl.NumberFormat('en-US',{maximumFractionDigits:0});
const nf2=new Intl.NumberFormat('en-US',{maximumFractionDigits:2});
const fmt=v=>nf.format(Math.round(v||0));
const short=v=>{const a=Math.abs(v);if(a>=1e6)return nf2.format(+(v/1e6).toFixed(2))+'M';if(a>=1e3)return nf.format(v/1e3)+'K';return nf.format(v)};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const months=()=>state.month==='all'?MONTHS.map(m=>m.k):[state.month];
const secTotal=(s,ms=months())=>ms.reduce((a,m)=>a+(S[s][m]||0),0);
const monthTotal=m=>SECTORS.reduce((a,s)=>a+(S[s.k][m]||0),0);

// tooltip
const tip=document.getElementById('tip');
function showTip(e,html){tip.innerHTML=html;tip.style.opacity=1;moveTip(e)}
function moveTip(e){const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY+14;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-14;tip.style.left=x+'px';tip.style.top=y+'px'}
function hideTip(){tip.style.opacity=0}
function bindTips(root){root.querySelectorAll('[data-tip]').forEach(el=>{el.addEventListener('mouseenter',e=>showTip(e,el.dataset.tip));el.addEventListener('mousemove',moveTip);el.addEventListener('mouseleave',hideTip)})}

let lastFocus=null;
function openModal(s,m){state.sector=s;state.month=m;state.q='';state.sort=null;lastFocus=document.activeElement;hideTip();renderModal();const o=document.getElementById('overlay');o.classList.add('open');o.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';document.getElementById('mClose').focus()}
function closeModal(){const o=document.getElementById('overlay');o.classList.remove('open');o.setAttribute('aria-hidden','true');document.body.style.overflow='';if(lastFocus)lastFocus.focus()}
function setModalMonth(m){state.month=m;state.q='';state.sort=null;renderModal()}
function renderModal(){
  const s=SC[state.sector];
  document.getElementById('mTitle').innerHTML=`<span class="dot" style="--c:${s.c}"></span>تفاصيل ${s.n} — ${state.month==='all'?'الأشهر الثلاثة':MN[state.month]}`;
  const el=document.getElementById('mMonths');
  el.innerHTML=[...MONTHS,{k:'all',n:'الأشهر الثلاثة'}].map(m=>`<button class="${state.month===m.k?'on':''}" data-m="${m.k}">${m.n}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>setModalMonth(b.dataset.m));
  renderDetail();
  document.querySelector('.mbody').scrollTop=0;
}
document.getElementById('mClose').onclick=closeModal;
document.getElementById('overlay').addEventListener('mousedown',e=>{if(e.target.id==='overlay')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('overlay').classList.contains('open'))closeModal()});

const ALL=MONTHS.map(m=>m.k);
function renderKPIs(){
  const total=ALL.reduce((a,m)=>a+monthTotal(m),0);
  const a=monthTotal('aug'),o=monthTotal('oct'),ch=(o-a)/a*100;
  const top=SECTORS.map(s=>({s,v:secTotal(s.k,ALL)})).sort((x,y)=>y.v-x.v)[0];
  const best=MONTHS.map(m=>({m,v:monthTotal(m.k)})).sort((x,y)=>y.v-x.v)[0];
  document.getElementById('kpis').innerHTML=`
   <div class="card kpi"><div class="lbl">إجمالي الإيرادات — الأشهر الثلاثة</div><div class="val">${fmt(total)} <small>ر.س</small></div><div class="note">متوسط شهري ${fmt(total/3)} ر.س</div></div>
   <div class="card kpi"><div class="lbl">التغير من أغسطس إلى أكتوبر</div><div class="val ${ch>=0?'up':'down'}">${ch>=0?'▲':'▼'} ${nf2.format(Math.abs(ch).toFixed(1))}%</div><div class="note">${fmt(a)} ← ${fmt(o)}</div></div>
   <div class="card kpi"><div class="lbl">أكبر قطاع</div><div class="val" style="direction:rtl">${top.s.n}</div><div class="note">${fmt(top.v)} ر.س · ${nf2.format((top.v/total*100).toFixed(1))}% من الإجمالي</div></div>
   <div class="card kpi"><div class="lbl">أعلى شهر إيرادًا</div><div class="val" style="direction:rtl">${best.m.n}</div><div class="note">${fmt(best.v)} ر.س</div></div>`;
}

function niceStep(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function niceAxis(max){const st=niceStep(max/4);const n=Math.ceil(max*1.06/st);return {nice:st*n,n}}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;const n=f<=1?1:f<=1.5?1.5:f<=2?2:f<=2.5?2.5:f<=3?3:f<=4?4:f<=5?5:f<=6?6:f<=8?8:10;return n*p}

function sectorChart(s){
  const W=420,H=250,pl=50,pr=14,pt=26,pb=34;
  const vals=MONTHS.map(m=>S[s.k][m.k]||0);
  const {nice,n:TK}=niceAxis(Math.max(...vals,1));
  const y=v=>pt+(H-pt-pb)*(1-v/nice);
  const cw=(W-pl-pr)/3,bw=Math.min(78,cw*.56);
  let g='';
  for(let i=0;i<=TK;i++){const t=nice*i/TK;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${pl-8}" y="${y(t)+4}" fill="var(--text-muted)" font-size="11" text-anchor="end">${short(t)}</text>`}
  MONTHS.forEach((m,i)=>{
    const v=vals[i],cx=pl+cw*(i+.5),x=cx-bw/2,top=y(v),h=Math.max(y(0)-top,v>0?3:0);
    const prev=i?vals[i-1]:null;const chg=prev?((v-prev)/prev*100):null;
    const chgTxt=chg==null?'':`<div class='muted'>${chg>=0?'▲':'▼'} ${nf2.format(Math.abs(chg).toFixed(1))}% عن ${MONTHS[i-1].n}</div>`;
    g+=`<g class="mbar" data-s="${s.k}" data-m="${m.k}" tabindex="0" role="button" aria-label="${s.n} ${m.n} ${fmt(v)} ريال، اضغط لعرض التفاصيل" data-tip="<b>${s.n} — ${m.n}</b><div class='tv'>${fmt(v)} ر.س</div>${chgTxt}<div class='muted'>اضغط لعرض التفاصيل</div>">
      <rect x="${cx-cw/2+4}" y="${pt-18}" width="${cw-8}" height="${H-pt-pb+18}" fill="transparent"/>
      ${h>0?`<path class="bfill" d="M${x},${y(0)} V${top+4} Q${x},${top} ${x+4},${top} H${x+bw-4} Q${x+bw},${top} ${x+bw},${top+4} V${y(0)} Z" fill="${s.hex}"/>`:''}
      <text x="${cx}" y="${top-8}" text-anchor="middle" fill="var(--text-primary)" font-size="12.5" font-weight="700">${v?short(v):'0'}</text>
      <text x="${cx}" y="${H-pb+21}" text-anchor="middle" fill="var(--text-secondary)" font-size="13" font-weight="600">${m.n}</text></g>`;
  });
  g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="#c9d1dd"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="direction:ltr" role="img" aria-label="إيرادات ${s.n} الشهرية">${g}</svg>`;
}

let shareMonth='all';
function arcPath(cx,cy,R,r,a0,a1){const p=(rad,a)=>[cx+rad*Math.sin(a),cy-rad*Math.cos(a)];const L=a1-a0>Math.PI?1:0;const [x0,y0]=p(R,a0),[x1,y1]=p(R,a1),[x2,y2]=p(r,a1),[x3,y3]=p(r,a0);return `M${x0},${y0} A${R},${R} 0 ${L} 1 ${x1},${y1} L${x2},${y2} A${r},${r} 0 ${L} 0 ${x3},${y3} Z`}
function shareChart(){
  const ms=shareMonth==='all'?ALL:[shareMonth];
  const grand=ms.reduce((a,m)=>a+monthTotal(m),0)||1;
  const rows=SECTORS.map(s=>({s,v:ms.reduce((a,m)=>a+(S[s.k][m]||0),0)})).sort((a,b)=>b.v-a.v);
  const cx=110,cy=110,R=100,r=64;let a=0,g='';
  const live=rows.filter(x=>x.v>0);
  live.forEach(x=>{const sw=x.v/grand*2*Math.PI;const a1=a+Math.max(sw,0.06);
    const tipTxt=`<b>${x.s.n} — ${shareMonth==='all'?'الأشهر الثلاثة':MN[shareMonth]}</b><div class='tv'>${fmt(x.v)} ر.س</div><div class='muted'>${nf2.format((x.v/grand*100).toFixed(1))}% من الإجمالي · اضغط للتفاصيل</div>`;
    g+=`<path class="dseg" data-s="${x.s.k}" d="${live.length===1?arcPath(cx,cy,R,r,0,Math.PI*1.9999):arcPath(cx,cy,R,r,a,a1)}" fill="${x.s.hex}" stroke="var(--surface-1)" stroke-width="2" style="cursor:pointer" data-tip="${tipTxt}"/>`;a=a1});
  g+=`<text x="${cx}" y="${cy-6}" text-anchor="middle" fill="var(--text-muted)" font-size="12">${shareMonth==='all'?'الأشهر الثلاثة':MN[shareMonth]}</text><text x="${cx}" y="${cy+16}" text-anchor="middle" fill="var(--text-primary)" font-size="19" font-weight="700">${short(grand)}</text>`;
  const legend=rows.map(x=>`<div class="lrow srow" data-s="${x.s.k}" tabindex="0" role="button" aria-label="${x.s.n} ${fmt(x.v)} ريال، اضغط لعرض التفاصيل"><span><i class="dot" style="--c:${x.s.c}"></i>${x.s.n}</span><span class="sval">${fmt(x.v)} <em>${nf2.format((x.v/grand*100).toFixed(1))}%</em></span></div>`).join('');
  return `<div class="donut"><svg viewBox="0 0 220 220" width="210" height="210" style="direction:ltr;flex:none" role="img" aria-label="توزيع الإيرادات حسب القطاع">${g}</svg><div class="dleg">${legend}</div></div>`;
}
function renderCharts(){
  const grand=ALL.reduce((a,m)=>a+monthTotal(m),0);
  let h=SECTORS.map(s=>{const v=secTotal(s.k,ALL),a=S[s.k].aug,o=S[s.k].oct;const ch=a?(o-a)/a*100:null;
    return `<div class="card chart-card" style="--c:${s.c}"><div class="bar"></div>
      <div class="top"><div><div class="nm"><span class="dot"></span>${s.n}</div><div class="meta" style="margin-top:6px"><span>${nf2.format((v/grand*100).toFixed(1))}% من الإجمالي</span></div></div>
      <div><div class="tv">${fmt(v)}</div><div class="meta" style="justify-content:flex-end">${ch==null?'لا إيراد في أغسطس':`<span class="${ch>=0?'up':'down'}">${ch>=0?'▲':'▼'} ${nf2.format(Math.abs(ch).toFixed(1))}%</span>&nbsp;أغسطس ← أكتوبر`}</div></div></div>
      ${sectorChart(s)}</div>`}).join('');
  const st=shareMonth==='all'?ALL:[shareMonth];const stot=st.reduce((a,m)=>a+monthTotal(m),0);
  h+=`<div class="card chart-card" style="--c:#8b95a7"><div class="bar"></div><div class="top"><div><div class="nm">توزيع الإيرادات حسب القطاع</div><div class="meta" style="margin-top:6px"><span>اضغط على أي قطاع لعرض تفاصيله</span></div></div><div class="tv">${fmt(stot)}</div></div>
    <div class="seg mini" id="shareSeg">${[...MONTHS,{k:'all',n:'الكل'}].map(m=>`<button class="${shareMonth===m.k?'on':''}" data-m="${m.k}">${m.n}</button>`).join('')}</div>${shareChart()}</div>`;
  const el=document.getElementById('charts');el.innerHTML=h;
  el.querySelectorAll('.mbar').forEach(b=>{b.addEventListener('click',()=>openModal(b.dataset.s,b.dataset.m));b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openModal(b.dataset.s,b.dataset.m)}})});
  el.querySelectorAll('#shareSeg button').forEach(b=>b.onclick=()=>{shareMonth=b.dataset.m;hideTip();renderCharts()});
  el.querySelectorAll('.srow,.dseg').forEach(r=>{const go=()=>openModal(r.dataset.s,shareMonth);r.addEventListener('click',go);r.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}})});
  bindTips(el);
}

/* ---------- details per sector ---------- */
const yes=v=>v?`<span class="tag ${String(v).toLowerCase()==='yes'?'yes':''}">${String(v).toLowerCase()==='yes'?'نعم':esc(v)}</span>`:'<span class="muted">—</span>';
const CFG={
 transport:{
   cols:[{k:'group',n:'المجموعة'},{k:'project',n:'المشروع / العميل'},{k:'company',n:'الشركة'},{k:'expected',n:'الإيراد المتوقع',num:1,sum:1},{k:'invoiced',n:'المبلغ المفوتر',num:1,sum:1},{k:'sent',n:'أُرسلت',f:yes},{k:'approved',n:'اعتُمدت',f:yes},{k:'inv',n:'رقم الفاتورة'}],
   value:'expected',
   kpis:r=>{const e=r.reduce((a,x)=>a+x.expected,0),i=r.reduce((a,x)=>a+x.invoiced,0);return[['الإيراد المتوقع',fmt(e)],['المبلغ المفوتر',i?fmt(i):'غير مسجل'],['نسبة التفوتر',i&&e?nf2.format((i/e*100).toFixed(1))+'%':'—'],['عدد البنود',r.length]]},
   charts:[{t:'حسب المجموعة',by:'group'},{t:'أعلى 10 مشاريع / عملاء',by:'project',top:10}]
 },
 crusher:{
   cols:null, value:'amt',
   kpis:r=>{const a=r.reduce((s,x)=>s+x.amt,0),q=r.reduce((s,x)=>s+x.qty,0);return[['قيمة المبيعات',fmt(a)],['الكمية الإجمالية',fmt(q)],['متوسط السعر للوحدة',q?nf2.format((a/q).toFixed(2)):'—'],['عدد العملاء',new Set(r.map(x=>x.client)).size]]},
   charts:[{t:'أعلى 10 عملاء',by:'client',top:10},{t:'حسب نوع المنتج',custom:'product'}]
 },
 mixer:{
   cols:[{k:'date',n:'التاريخ'},{k:'client',n:'العميل / المشروع'},{k:'mix',n:'نوع الخلطة'},{k:'qty',n:'الكمية (طن)',num:1,sum:1,dec:1},{k:'price',n:'السعر',num:1,dec:1},{k:'total',n:'الإجمالي',num:1,sum:1},{k:'note',n:'ملاحظات'}],
   value:'total',
   kpis:r=>{const a=r.reduce((s,x)=>s+x.total,0),q=r.reduce((s,x)=>s+x.qty,0);return[['قيمة المبيعات',fmt(a)],['الكمية (طن)',nf2.format(q)],['متوسط سعر الطن',q?nf2.format((a/q).toFixed(1)):'—'],['عدد العملاء',new Set(r.map(x=>x.client)).size]]},
   charts:[{t:'حسب العميل / المشروع',by:'client',top:10},{t:'حسب نوع الخلطة',by:'mix',onlyIf:r=>r.some(x=>x.mix)}]
 },
 paint:{
   cols:[{k:'service',n:'نوع الخدمة'},{k:'qty',n:'الكمية (م²)',num:1,sum:1,dec:1},{k:'rate',n:'سعر المتر',num:1,dec:2},{k:'value',n:'القيمة',num:1,sum:1}],
   value:'value',
   kpis:r=>{const a=r.reduce((s,x)=>s+x.value,0),q=r.reduce((s,x)=>s+x.qty,0);return[['قيمة الخدمات',fmt(a)],['المساحة المنفذة (م²)',fmt(q)],['عدد البنود',r.length],['أنواع الخدمات',new Set(r.map(x=>x.service)).size]]},
   charts:[{t:'حسب نوع الخدمة',by:'service'}]
 },
 rental:{
   cols:[{k:'eqp',n:'المعدة'},{k:'code',n:'كود المعدة'},{k:'client',n:'العميل'},{k:'rateText',n:'الإيجار الشهري',numText:1},{k:'comment',n:'ملاحظات'}],
   value:'rate',
   kpis:(r,ms)=>{const c=ms.reduce((a,m)=>a+(S.rental[m]||0),0),rt=r.reduce((a,x)=>a+(x.rate||0),0);return[['الإيراد في الملف المجمع',fmt(c)],['مجموع الإيجارات الشهرية',fmt(rt)],['عدد المعدات',r.length],['عدد العملاء',new Set(r.map(x=>x.client)).size]]},
   charts:[{t:'الإيجار الشهري حسب العميل',by:'client'},{t:'الإيجار الشهري حسب المعدة',by:'eqp'}]
 }
};
const PRODUCTS=['3/4','3/8','3/16','Mix','Powder','1"','1.5"','4"','رمل'];

function rowsFor(sec,ms){
  return ms.flatMap(m=>(DATA.details[sec][m].rows||[]).map(r=>{const o={...r,_m:m};if(sec==='paint')o.rate=r.qty?r.value/r.qty:0;return o}));
}

function hbar(items,color){
  if(!items.length)return '<div class="muted" style="padding:20px 0">لا توجد بيانات لهذا الاختيار</div>';
  const max=Math.max(...items.map(i=>i.v),1),rowH=30,W=600,lab=270,H=items.length*rowH+6;
  let g='';
  items.forEach((it,i)=>{const y=i*rowH+4,w=Math.max((W-lab-80)*it.v/max,it.v>0?3:0);
    const name=it.n.length>36?it.n.slice(0,35)+'…':it.n;
    g+=`<g data-tip="<b>${esc(it.n)}</b><div class='tv'>${fmt(it.v)}</div><div class='muted'>${nf2.format(it.p.toFixed(1))}% من القطاع</div>"><rect x="0" y="${y-2}" width="${W}" height="${rowH}" fill="transparent"/>
      <text x="${W}" y="${y+16}" text-anchor="end" fill="var(--text-secondary)" font-size="12">${esc(name)}</text>
      <rect x="${W-lab-w}" y="${y+4}" width="${w}" height="16" rx="4" fill="${color}"/>
      <text x="${W-lab-w-6}" y="${y+16}" text-anchor="end" fill="var(--text-primary)" font-size="11.5">${short(it.v)}</text></g>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="direction:ltr">${g}</svg>`;
}
function groupBy(rows,key,val){const m=new Map();rows.forEach(r=>{const k=(r[key]||'—').toString().trim()||'—';m.set(k,(m.get(k)||0)+(r[val]||0))});const t=[...m.values()].reduce((a,b)=>a+b,0)||1;return [...m].map(([n,v])=>({n,v,p:v/t*100})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v)}

function renderDetail(){
  const sec=state.sector,s=SC[sec],cfg=CFG[sec],ms=months();
  let rows=rowsFor(sec,ms);
  const total=secTotal(sec);
  const mlabel=state.month==='all'?'الأشهر الثلاثة':MN[state.month];
  let h='';
  if(sec==='rental'){h+=`<div class="banner">⚠️ <div><b>تنبيه مطابقة:</b> قيمة تأجير المعدات في الملف المجمع (${MONTHS.map(m=>m.n+' '+fmt(S.rental[m.k])).join(' · ')}) لا تساوي مجموع الإيجارات الشهرية في ملف المعدات المؤجرة (${MONTHS.map(m=>m.n+' '+fmt(DATA.details.rental[m.k].rows.reduce((a,x)=>a+(x.rate||0),0))).join(' · ')}). اللوحة تعتمد رقم الملف المجمع في الإجماليات، والجدول أدناه يعرض بيانات ملف المعدات كما هي.</div></div>`}
  if(sec==='paint'&&ms.length===1&&ms[0]==='aug'){h+=`<div class="banner">ℹ️ <div>لا توجد إيرادات مسجلة لقطاع الدهانات والأسفلت في شهر أغسطس (البنود مسجلة بقيمة صفر في ملف خدمات الخلاطة).</div></div>`}
  if(sec==='transport'&&ms.includes('oct')){h+=`<div class="banner">ℹ️ <div>ملف النقليات لشهر أكتوبر يحتوي على الإيراد المتوقع فقط (بدون أعمدة الفوترة والاعتماد)، وفي أغسطس أعمدة الفوترة فارغة.</div></div>`}
  const k=cfg.kpis(rows,ms);
  h+=`<div class="dk">${k.map(([l,v])=>`<div class="card"><div class="lbl">${l}</div><div class="val">${v}</div></div>`).join('')}</div>`;
  // charts
  const charts=cfg.charts.filter(c=>!c.onlyIf||c.onlyIf(rows));
  h+=`<div class="charts2 ${charts.length===1?'one':''}">`;
  charts.forEach(c=>{let items;
    if(c.custom==='product'){const m=new Map();rows.forEach(r=>Object.entries(r.products).forEach(([p,o])=>m.set(p,(m.get(p)||0)+o.amt)));const t=[...m.values()].reduce((a,b)=>a+b,0)||1;items=[...m].map(([n,v])=>({n,v,p:v/t*100})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v)}
    else{items=groupBy(rows,c.by,cfg.value);if(c.top)items=items.slice(0,c.top)}
    h+=`<div class="card" style="background:var(--surface-2)"><div class="ct"><h3>${c.t}</h3></div>${hbar(items,s.hex)}</div>`});
  h+=`</div>`;
  // table
  let cols=cfg.cols;
  if(sec==='crusher'){const used=PRODUCTS.filter(p=>rows.some(r=>r.products[p]));cols=[{k:'client',n:'العميل'},...used.flatMap(p=>[{k:'pq_'+p,n:p+' كمية',num:1,sum:1,dec:1},{k:'pa_'+p,n:p+' قيمة',num:1,sum:1}]),{k:'qty',n:'إجمالي الكمية',num:1,sum:1,dec:1},{k:'amt',n:'إجمالي القيمة',num:1,sum:1}];
    rows=rows.map(r=>{const o={...r};used.forEach(p=>{o['pq_'+p]=r.products[p]?.qty||0;o['pa_'+p]=r.products[p]?.amt||0});return o})}
  if(ms.length>1)cols=[{k:'_mn',n:'الشهر'},...cols];
  rows.forEach(r=>r._mn=MN[r._m]);
  h+=`<div class="tools"><h3 style="margin:0;font-size:15px">البيانات التفصيلية من ملف الإكسيل <span class="muted" style="font-weight:400;font-size:12px">(${rows.length} بند)</span></h3><input class="search" id="q" placeholder="ابحث في الجدول…" value="${esc(state.q)}"></div>`;
  h+=`<div class="tw"><table class="dt"><thead><tr>${cols.map((c,i)=>`<th data-i="${i}">${c.n}${state.sort&&state.sort.i===i?(state.sort.d>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody id="tb"></tbody><tfoot id="tf"></tfoot></table></div>`;
  h+=`<div class="src">المصدر: ${s.src} · إجمالي القطاع في الملف المجمع لهذا الاختيار: ${fmt(total)} ر.س</div>`;
  const el=document.getElementById('detail'); el.innerHTML=h;
  bindTips(el);
  const drawBody=()=>{
    const q=state.q.trim().toLowerCase();
    let r=q?rows.filter(x=>cols.some(c=>String(x[c.k]??'').toLowerCase().includes(q))):rows.slice();
    if(state.sort){const c=cols[state.sort.i],d=state.sort.d;r.sort((a,b)=>{const va=c.numText?(a.rate??-1):a[c.k],vb=c.numText?(b.rate??-1):b[c.k];return (typeof va==='number'&&typeof vb==='number'?va-vb:String(va??'').localeCompare(String(vb??''),'ar'))*d})}
    const cell=(c,x)=>{const v=x[c.k];if(c.f)return `<td>${c.f(v)}</td>`;if(c.num)return `<td class="n">${v?(c.dec?nf2.format(+v.toFixed(c.dec)):fmt(v)):'<span class="muted">—</span>'}</td>`;if(c.numText)return `<td class="n">${x.rate!=null?fmt(x.rate):esc(v)}</td>`;return `<td>${v!==''&&v!=null?esc(v):'<span class="muted">—</span>'}</td>`};
    document.getElementById('tb').innerHTML=r.length?r.map(x=>`<tr>${cols.map(c=>cell(c,x)).join('')}</tr>`).join(''):`<tr><td colspan="${cols.length}" class="muted" style="text-align:center;padding:24px">لا توجد بنود مطابقة</td></tr>`;
    document.getElementById('tf').innerHTML=`<tr>${cols.map((c,i)=>i===0?`<td>الإجمالي</td>`:c.sum?`<td class="n">${c.dec?nf2.format(+r.reduce((a,x)=>a+(x[c.k]||0),0).toFixed(c.dec)):fmt(r.reduce((a,x)=>a+(x[c.k]||0),0))}</td>`:c.numText?`<td class="n">${fmt(r.reduce((a,x)=>a+(x.rate||0),0))}</td>`:'<td></td>').join('')}</tr>`;
  };
  drawBody();
  const qi=document.getElementById('q');
  qi.oninput=()=>{state.q=qi.value;drawBody()};
  el.querySelectorAll('.dt th').forEach(th=>th.onclick=()=>{const i=+th.dataset.i;state.sort=state.sort&&state.sort.i===i?{i,d:-state.sort.d}:{i,d:cols[i].num||cols[i].numText?-1:1};renderDetail();const q2=document.getElementById('q');q2.focus();q2.setSelectionRange(q2.value.length,q2.value.length)});
}

function render(){renderKPIs();renderCharts()}
document.getElementById('foot').innerHTML='الأرقام الإجمالية من ملف الإيرادات المجمع، والتفاصيل من ملفات القطاعات الخمسة. تمت مطابقة إجماليات النقليات والكسارات والخلاطة والدهانات مع الملف المجمع لكل شهر وجاءت متطابقة؛ قطاع تأجير المعدات غير متطابق (انظر التنبيه في تفاصيله).';
render();
</script>
</body>
